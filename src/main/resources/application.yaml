server:
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  docker:
    compose:
#      lifecycle-management: start_only
      lifecycle-management: start_and_stop
  datasource:
    url: jdbc:mysql://localhost:3306/observability_study
    username: username
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: my-hikari-pool
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 60000
      idle-timeout: 10000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  application:
    name: observability-study
  security:
    user:
      name: wonjjong
      password: 1234

management:
  observations:
    http:
      server:
        requests:
          enabled: true
  endpoints:
    jmx:
      exposure:
        exclude: "*"
    web:
      base-path: /monitoring/actuator
      exposure:
        include: health, info, prometheus, loggers, metrics, threaddump # 기본으로 health, info만 활성화 됨
    access:
      default: none
  endpoint:
    health:
      access: read_only
      show-details: always
    info:
      access: read_only
    prometheus:
      access: read_only
    loggers:
      access: read_only
    metrics:
      access: read_only
    threaddump:
      access: read_only

  server:
    port: 9091



