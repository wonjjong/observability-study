server:
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  docker:
    compose:
      lifecycle-management: start_only # 컨테이너를 켜기만 하고 연결 정보 주입은 안 함
  datasource:
    hikari:
      jdbc-url: jdbc:mysql://host.docker.internal:3306/observability_study
      username: root
      password: password
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: my-hikari-pool
      maximum-pool-size: 10
      minimum-idle: 10 # 보통 max와 동일하게 설정
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 60000
      idle-timeout: 10000

  application:
    name: observability-study
  security:
    user:
      name: wonjjong
      password: 1234

management:
  observations:
    http:
      server:
        requests:
          enabled: true
  endpoints:
    jmx:
      exposure:
        exclude: "*"
    web:
      base-path: /monitoring/actuator
      exposure:
        include: health, info, prometheus, loggers, metrics, threaddump # 기본으로 health, info만 활성화 됨
    access:
      default: none
  endpoint:
    health:
      access: read_only
      show-details: always
    info:
      access: read_only
    prometheus:
      access: read_only
    loggers:
      access: read_only
    metrics:
      access: read_only
    threaddump:
      access: read_only

  server:
    port: 9091



